version: 2

models:
  - name: dim_publishers
    description: Dimension table of publishers, one row per publisher.
    columns:
      - name: publisher_id
        description: Surrogate primary key for publishers, generated via dense_rank() over publisher name.
        data_tests:
          - not_null
          - unique
      - name: publisher_name
        description: Distinct trimmed publisher name from the books source.