```yaml
version: 2
models:
  - name: dim_books
    description: Dimension table of books with one row per book.
    columns:
      - name: book_id
        description: Primary key. ISBN from books table cast as string.
        data_tests:
          - not_null
          - unique
      - name: title
        description: Book title from books table, trimmed of whitespace.
      - name: author_name
        description: Author name from books table, normalized with initcap.
      - name: publication_year
        description: Year of publication from books table. 0 replaced with NULL.
      - name: publisher_name
        description: Publisher name from books table, trimmed.
      - name: image_small
        description: URL to small cover image from books table.
      - name: image_medium
        description: URL to medium cover image from books table.
      - name: image_large
        description: URL to large cover image from books table.
```