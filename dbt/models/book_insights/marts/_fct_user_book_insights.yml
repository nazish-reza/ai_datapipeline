version: 2
models:
  - name: fct_user_book_insights
    description: Fact table at the user-book grain with one row per user-book combination, capturing rating insights and related user/book attributes.
    columns:
      - name: insight_id
        description: Primary key for the insight record, generated via row_number().
        data_tests:
          - not_null
          - unique
      - name: user_id
        description: Foreign key to dim_users, identifying the user.
        data_tests:
          - not_null
      - name: book_id
        description: Foreign key to dim_books, identifying the book.
        data_tests:
          - not_null
      - name: author_name
        description: Name of the book's author.
      - name: publisher_name
        description: Name of the book's publisher.
      - name: user_age_group
        description: Age group classification of the user.
      - name: avg_user_rating
        description: Average rating given by this user across all books they have rated.
      - name: avg_book_rating
        description: Average rating received by this book across all users who have rated it.
      - name: rating_deviation
        description: Difference between the user's rating for this book and the book's average rating.
      - name: user_location_country
        description: Country extracted from the user's location string.
      - name: high_rating_flag
        description: Flag indicating if the user's rating for this book is high (1 if rating >= 8, else 0).
        data_tests:
          - accepted_values:
              values: [0, 1]