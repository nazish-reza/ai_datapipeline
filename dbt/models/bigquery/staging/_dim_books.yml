version: 2

models:
  - name: dim_books
    description: "Dimension table containing book information"
    columns:
      - name: book_id
        description: "Primary key"
        data_tests:
          - not_null
          - unique
      - name: title
        description: "Book title with cleaned spaces"
        data_tests: []
      - name: author_name
        description: "Author name normalized with proper capitalization"
        data_tests: []
      - name: publication_year
        description: "Year of publication with invalid years (0) set to null"
        data_tests: []
      - name: publisher_name
        description: "Publisher name with trimmed spaces"
        data_tests: []
      - name: image_small
        description: "URL for small book image"
        data_tests: []
      - name: image_medium
        description: "URL for medium book image"
        data_tests: []
      - name: image_large
        description: "URL for large book image"
        data_tests: []