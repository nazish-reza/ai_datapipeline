```yaml
version: 2

models:
  - name: dim_books
    description: "Dimension table for books with cleaned and normalized attributes"
    columns:
      - name: book_id
        description: "Primary key, derived from ISBN"
        data_tests:
          - not_null
          - unique
      - name: title
        description: "Book title with trimmed whitespace"
      - name: author_name
        description: "Normalized author name with proper capitalization"
      - name: publication_year
        description: "Publication year with invalid values (0) set to null"
      - name: publisher_name
        description: "Publisher name with trimmed whitespace"
      - name: image_small
        description: "URL for small book image"
      - name: image_medium
        description: "URL for medium book image"
      - name: image_large
        description: "URL for large book image"
```