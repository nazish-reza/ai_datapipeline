version: 2

models:
  - name: dim_books
    description: Dimension table for books with metadata and images
    columns:
      - name: book_id
        description: Primary key
        data_tests: [not_null, unique]
      - name: title
        description: Clean spaces
        data_tests: []
      - name: author_name
        description: Normalize
        data_tests: []
      - name: publication_year
        description: Remove invalid year
        data_tests: []
      - name: publisher_name
        description: Publisher name
        data_tests: []
      - name: image_small
        description: Small image URL
        data_tests: []
      - name: image_medium
        description: Medium image URL
        data_tests: []
      - name: image_large
        description: Large image URL
        data_tests: []