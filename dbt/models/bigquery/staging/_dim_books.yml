version: 2

models:
  - name: dim_books
    description: Dimension table containing book information
    columns:
      - name: book_id
        description: Unique identifier for the book (primary key)
        data_tests:
          - not_null
          - unique
      - name: title
        description: Book title with cleaned spaces
      - name: author_name
        description: Normalized author name
      - name: publication_year
        description: Publication year with invalid years removed
      - name: publisher_name
        description: Publisher name
      - name: image_small
        description: Small image URL
      - name: image_medium
        description: Medium image URL
      - name: image_large
        description: Large image URL