version: 2
models:
- name: dim_publishers
  description: Dimension table of publishers, one row per unique publisher
  columns:
  - name: publisher_id
    description: Surrogate key for publishers, generated by dense_rank on trimmed publisher names from books.Publisher
    data_tests:
    - not_null
    - unique
  - name: publisher_name
    description: Publisher name with trimmed whitespace, sourced from books.Publisher
    data_tests:
    - not_null