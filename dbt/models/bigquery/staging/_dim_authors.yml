version: 2
models:
  - name: dim_authors
    description: Dimension table of authors, one row per unique author
    columns:
      - name: author_id
        description: Surrogate key for authors, assigned by ranking trimmed author names from books.Book-Author
        data_tests:
          - not_null
          - unique
      - name: author_name
        description: Author name, trimmed from the Book-Author field in books
        data_tests:
          - not_null