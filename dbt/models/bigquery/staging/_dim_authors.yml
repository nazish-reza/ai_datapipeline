version: 2

models:
  - name: dim_authors
    description: "Dimension table for authors, with a surrogate key and cleaned author names."
    columns:
      - name: author_id
        description: "Surrogate key for authors"
        data_tests: [not_null, unique]
      - name: author_name
        description: "Cleaned author name (trimmed and distinct)"
        data_tests: []