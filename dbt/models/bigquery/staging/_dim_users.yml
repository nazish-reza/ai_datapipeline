version: 2
models:
  - name: dim_users
    description: "Dimension table for users, containing user information and derived attributes"
    columns:
      - name: user_id
        description: "Primary key"
        data_tests:
          - not_null
          - unique
      - name: location_raw
        description: "User location"
      - name: age
        description: "User age"
      - name: age_group
        description: "Derived column"
        data_tests:
          - accepted_values:
              values:
                - 'Under 18'
                - '18-25'
                - '26-40'
                - '40+'
                - 'Unknown'