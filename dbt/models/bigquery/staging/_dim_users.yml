version: 2

models:
  - name: dim_users
    description: "Dimension table containing user information including identifiers, location, and age details."
    columns:
      - name: user_id
        description: "Primary key"
        data_tests: [not_null, unique]
      - name: location_raw
        description: "User's location with whitespace trimmed"
        data_tests: []
      - name: age
        description: "User's age cast to integer"
        data_tests: []
      - name: age_group
        description: "Derived column"
        data_tests:
          - accepted_values:
              values:
                - Under 18
                - 18-25
                - 26-40
                - 40+
                - Unknown