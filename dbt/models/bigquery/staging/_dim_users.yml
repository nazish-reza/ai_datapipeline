```yaml
version: 2
models:
  - name: dim_users
    description: "Dimension table for users with demographic information"
    columns:
      - name: user_id
        description: "Primary key for users"
        data_tests:
          - not_null
          - unique
      - name: location_raw
        description: "Raw location data from source"
      - name: age
        description: "User's age as integer"
      - name: age_group
        description: "Derived age group categorization"
        data_tests:
          - accepted_values:
              values: ['Under 18', '18-25', '26-40', '40+', 'Unknown']
```