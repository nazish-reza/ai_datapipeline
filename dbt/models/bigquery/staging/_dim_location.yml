version: 2
models:
  - name: dim_location
    description: Dimension table for locations with one row per unique location, derived from user data.
    columns:
      - name: location_id
        description: Surrogate primary key for locations, generated from user location data.
        data_tests:
          - not_null
          - unique
      - name: city
        description: City name, extracted from user location data.
      - name: state
        description: State or province name, extracted from user location data.
      - name: country
        description: Country name, extracted from user location data.