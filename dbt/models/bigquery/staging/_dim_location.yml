```yaml
version: 2

models:
  - name: dim_location
    description: "Dimension table for location data with surrogate key and parsed city, state, and country from user locations."
    columns:
      - name: location_id
        description: "Surrogate key for the location dimension."
        data_tests:
          - not_null
          - unique
      - name: city
        description: "City component extracted from the Location field (first part before comma)."
        data_tests:
          - not_null
      - name: state
        description: "State component extracted from the Location field (second part after first comma)."
        data_tests:
          - nullable
      - name: country
        description: "Country component extracted from the Location field (third part after second comma)."
        data_tests:
          - nullable
```