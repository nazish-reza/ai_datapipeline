```yaml
version: 2

models:
  - name: dim_location
    description: "Dimension table for location data, derived from the users table's Location column."
    columns:
      - name: location_id
        description: "Surrogate key for location dimension, generated using dense_rank over Location."
        data_tests:
          - not_null
          - unique
      - name: city
        description: "City extracted from the Location string (first part of comma-separated values)."
        data_tests: []
      - name: state
        description: "State extracted from the Location string (second part of comma-separated values)."
        data_tests: []
      - name: country
        description: "Country extracted from the Location string (third part of comma-separated values)."
        data_tests: []
```