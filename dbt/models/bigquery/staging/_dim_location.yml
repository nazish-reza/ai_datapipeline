```yaml
version: 2

models:
  - name: dim_location
    description: Dimension table for locations, with city, state, and country information extracted from user locations.
    columns:
      - name: location_id
        description: Surrogate key for the location dimension.
        data_tests:
          - not_null
          - unique
      - name: city
        description: City part extracted from the location string.
        data_tests: []
      - name: state
        description: State part extracted from the location string.
        data_tests: []
      - name: country
        description: Country part extracted from the location string.
        data_tests: []
```