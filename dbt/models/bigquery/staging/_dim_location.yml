```yaml
version: 2

models:
  - name: dim_location
    description: "Dimension table for location information derived from the users table's Location column."
    columns:
      - name: location_id
        description: "Surrogate key for location dimension"
        data_tests:
          - not_null
          - unique
      - name: city
        description: "City extracted from the Location string"
        data_tests: []
      - name: state
        description: "State extracted from the Location string"
        data_tests: []
      - name: country
        description: "Country extracted from the Location string"
        data_tests: []
