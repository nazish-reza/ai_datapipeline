version: 2

models:
  - name: fct_user_book_insights
    description: Fact table containing user book insights with ratings, author/publisher information, and derived metrics.
    columns:
      - name: insight_id
        description: Primary key generated as row number.
        data_tests:
          - not_null
          - unique
      - name: user_id
        description: Foreign key referencing users table.
        data_tests:
          - not_null
      - name: book_id
        description: Foreign key referencing books table.
        data_tests:
          - not_null
      - name: author_name
        description: Name of the book author.
      - name: publisher_name
        description: Name of the book publisher.
      - name: user_age_group
        description: Age group of the user derived from their age.
        data_tests:
          - accepted_values:
              values: ['Under 18', '18-25', '26-40', '40+', 'Unknown']
      - name: avg_user_rating
        description: Average rating given by the user across all their ratings.
      - name: avg_book_rating
        description: Average rating for the book across all users.
      - name: rating_deviation
        description: Difference between the user's rating and the average book rating.
      - name: user_location_country
        description: Country extracted from the user's location string.
      - name: high_rating_flag
        description: Flag indicating if the rating is 8 or higher (1) or not (0).
        data_tests:
          - accepted_values:
              values: [0, 1]