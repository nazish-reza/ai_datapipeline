version: 2

models:
  - name: fact_book_ratings
    description: Fact table containing book ratings with categorized rating levels
    columns:
      - name: rating_id
        description: Primary key for the rating record
        data_tests:
          - not_null
          - unique
      - name: user_id
        description: Foreign key to users
        data_tests:
          - not_null
      - name: book_id
        description: Foreign key to books
        data_tests:
          - not_null
      - name: rating
        description: Book rating value
      - name: rating_category
        description: Derived rating category
        data_tests:
          - accepted_values:
              values: ['High', 'Medium', 'Low']
      - name: rating_date
        description: Timestamp when rating was recorded