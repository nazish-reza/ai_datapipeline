version: 2

models:
  - name: fact_book_ratings
    description: Fact table containing book ratings with derived categories and timestamps
    columns:
      - name: rating_id
        description: Primary key
        tests:
          - not_null
          - unique
      - name: user_id
        description: Foreign key to users
        tests:
          - not_null
      - name: book_id
        description: Foreign key to books
        tests:
          - not_null
      - name: rating
        description: Numerical book rating
      - name: rating_category
        description: Derived rating category
        tests:
          - accepted_values:
              values: ['High', 'Medium', 'Low']
      - name: rating_date
        description: Timestamp when rating was recorded