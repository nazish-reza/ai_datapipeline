version: 2

models:
  - name: books_clean_stg
    description: "Staged and cleaned books data from the raw book_dataset source"
    config:
      tags: ['bigquery']

    columns:
      - name: isbn
        description: "International Standard Book Number — unique identifier for a book"
        tests:
          - not_null:
              config:
                severity: warn
          - unique:
              config:
                severity: warn

      - name: book_title
        description: "Title of the book"
        tests:
          - not_null:
              config:
                severity: warn

      - name: book_author
        description: "Author of the books"
        tests:
          - not_null:
              config:
                severity: warn

      - name: year_of_publication
        description: "Year the book was published"
        tests:
          - not_null:
              config:
                severity: warn

      - name: publisher
        description: "Publisher of the books"
        tests:
          - not_null:
              config:
                severity: warn

      - name: image_url_s
        description: "URL for small book cover image"
        tests:
          - not_null:
              config:
                severity: warn

      - name: image_url_m
        description: "URL for medium book cover image"
        tests:
          - not_null:
              config:
                severity: warn

      - name: image_url_l
        description: "URL for large book cover image"
        tests:
          - not_null:
              config:
                severity: warn