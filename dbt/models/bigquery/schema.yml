version: 2

sources:
  - name: demo_dataset
    schema: demo_dataset
    tables:
      - name: employees
        description: "Source table in BigQuery holding employee data"
        columns:
          - name: id
            tests: [not_null, unique]
          - name: name
            tests: [not_null]

models:
  - name: my_bigquery_model
    description: "Transform that selects from the BigQuery source table"
    columns:
      - name: id
        tests: [not_null]
      - name: department
        tests: [not_null]