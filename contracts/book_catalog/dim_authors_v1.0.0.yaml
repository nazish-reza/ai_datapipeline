version: 1.0.0
kind: DataContract
apiVersion: v3.0.2
id: book_catalog.dim_authors
name: dim_authors
tags:
- authors
- catalog
- dimension
status: development
servers:
- server: production
  type: BigQuery
  description: BigQuery dataset for book_catalog
  environment: production
  project: genuine-arena-458814-u7
  dataset: books_stg
dataProduct: dim_authors
description:
  purpose: Author-level filtering and enrichment.
domain: book_catalog
schema:
- name: dim_authors
  physicalType: table
  description: Author dimension with surrogate keys derived from the raw books source.
  tags:
  - authors
  - catalog
  - dimension
  logicalType: object
  physicalName: dim_authors
  properties:
  - name: author_id
    physicalType: INT64
    description: Surrogate PK via dense_rank() over author name.
    businessName: Author ID
    primaryKey: true
    primaryKeyPosition: 1
    logicalType: integer
    required: true
    unique: true
    transformSourceObjects:
    - books
    transformDescription: Surrogate key
    examples:
    - '1'
    quality:
    - description: author_id must not be null
      severity: error
      type: not_null
    - description: author_id must be unique
      severity: error
      type: unique
  - name: author_name
    physicalType: STRING
    description: Distinct trimmed author name.
    businessName: Author Name
    primaryKey: false
    logicalType: string
    required: true
    unique: true
    transformSourceObjects:
    - books
    transformDescription: Deduplicated author name
    examples:
    - J.R.R. Tolkien
    quality:
    - description: author_name must not be null
      severity: error
      type: not_null
    - description: author_name must be unique
      severity: warning
      type: unique
team:
