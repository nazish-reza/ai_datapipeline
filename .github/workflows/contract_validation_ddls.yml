name: "Action 1 — Validate Contract + Create BigQuery Table"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "contracts/**/*.yaml"

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-create:
    name: Validate Contract + BigQuery DDL
    runs-on: ubuntu-latest

    steps:
      - name: Check if bot commit
        id: guard
        run: |
          if [ "${{ github.actor }}" = "github-actions[bot]" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout PR branch
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install "datacontract-cli[excel]" google-cloud-bigquery pyyaml

      - name: Authenticate to Google Cloud
        if: steps.guard.outputs.skip != 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Detect changed contracts
        if: steps.guard.outputs.skip != 'true'
        id: changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- contracts/ > changed.txt
          echo "Changed contracts:"
          cat changed.txt
          echo "files=$(cat changed.txt | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Validate + Export DDL + Create BigQuery tables
        if: steps.guard.outputs.skip != 'true'
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          python3 << 'PYEOF'
          import os, subprocess, yaml, sys
          from pathlib import Path

          changed = os.environ.get("CHANGED_FILES", "").strip().split()
          yaml_files = [f for f in changed if f.endswith(".yaml") and Path(f).exists()]

          if not yaml_files:
              print("No changed YAML contracts found.")
              sys.exit(0)

          errors = []

          for yf in yaml_files:
              print(f"\n{'='*60}")
              print(f"📄 {yf}")
              print(f"{'='*60}")
              path = Path(yf)
              domain = path.parent.name
              entity = path.stem.split("_v")[0]

              # ── 1. Validate contract via datacontract lint ─────────
              print("  🔍 Validating contract...")
              lint = subprocess.run(
                  ["datacontract", "lint", yf],
                  capture_output=True, text=True
              )
              if lint.returncode != 0:
                  print(f"  ⚠️  Lint warnings:\n{lint.stdout}\n{lint.stderr}")
              else:
                  print(f"  ✅ Contract valid")

              # ── 2. Export BigQuery DDL ──────────────────────────────
              ddl_dir = Path("ddl") / domain
              ddl_dir.mkdir(parents=True, exist_ok=True)
              ddl_path = ddl_dir / f"{entity}.sql"

              print("  📝 Exporting DDL...")

              # Try sql export first (v0.12+ syntax)
              export_ok = False
              for cmd in [
                  ["datacontract", "export", "sql", yf],
                  ["datacontract", "export", yf, "--format", "sql"],
              ]:
                  result = subprocess.run(cmd, capture_output=True, text=True)
                  if result.returncode == 0 and result.stdout.strip():
                      ddl_path.write_text(result.stdout.strip())
                      print(f"  ✅ DDL saved → {ddl_path}")
                      export_ok = True
                      break

              if not export_ok:
                  # Fallback: generate DDL from YAML schema manually
                  print("  ℹ️  CLI export failed, generating DDL from schema...")
                  contract = yaml.safe_load(path.read_text())
                  schema = contract.get("schema", [])
                  if schema:
                      table = schema[0]
                      cols = table.get("properties", table.get("columns", []))
                      type_map = {"string":"STRING","integer":"INT64","number":"FLOAT64",
                                  "boolean":"BOOL","timestamp":"TIMESTAMP","date":"DATE"}

                      # Read project/dataset from servers
                      servers = contract.get("servers", [])
                      bq = next((s for s in servers if "bigquery" in str(s.get("type","")).lower()), {})
                      project = bq.get("project", "your-project")
                      dataset = bq.get("dataset", domain)

                      ddl_lines = [
                          f"-- DDL for {entity} (domain: {domain})",
                          f"CREATE TABLE IF NOT EXISTS `{project}.{dataset}.{entity}` ("
                      ]
                      col_defs = []
                      for c in cols:
                          ptype = c.get("physicalType", type_map.get(c.get("logicalType","string"), "STRING"))
                          nn = " NOT NULL" if c.get("required") or c.get("primaryKey") else ""
                          col_defs.append(f"  {c['name']:<35} {ptype}{nn}")
                      ddl_lines.append(",\n".join(col_defs))
                      ddl_lines.append(");")
                      ddl_sql = "\n".join(ddl_lines)
                      ddl_path.write_text(ddl_sql)
                      print(f"  ✅ DDL generated → {ddl_path}")
                  else:
                      print(f"  ⚠️  No schema found in contract")
                      errors.append(f"{yf}: no schema")
                      continue

              # ── 3. Apply DDL to BigQuery ────────────────────────────
              print("  🏗️  Creating BigQuery table...")
              try:
                  contract = yaml.safe_load(path.read_text())
                  servers = contract.get("servers", [])
                  bq = next((s for s in servers if "bigquery" in str(s.get("type","")).lower()), {})
                  project = bq.get("project", "")
                  dataset = bq.get("dataset", domain)

                  if project:
                      from google.cloud import bigquery
                      client = bigquery.Client(project=project)
                      ddl_sql = ddl_path.read_text()
                      for stmt in ddl_sql.split(";"):
                          stmt = stmt.strip()
                          if stmt and not stmt.startswith("--"):
                              try:
                                  client.query(stmt).result()
                              except Exception as e:
                                  print(f"  ⚠️  BQ error: {e}")
                      print(f"  ✅ BigQuery table created/updated → {project}.{dataset}.{entity}")
                  else:
                      print(f"  ℹ️  No BigQuery project configured — DDL saved but not applied")
              except Exception as e:
                  print(f"  ⚠️  BQ error: {e}")

          if errors:
              print(f"\n⚠️  {len(errors)} error(s):")
              for e in errors: print(f"  - {e}")

          print("\n✅ Action 1 processing complete")
          PYEOF

      - name: Commit DDL files via GitHub API
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git add ddl/ || true
          if git diff --staged --quiet; then
            echo "No DDL changes to commit"
            exit 0
          fi
          python3 << 'PYEOF'
          import os, base64, subprocess, json, urllib.request

          token    = os.environ["GH_TOKEN"]
          repo     = os.environ["REPO"]
          branch   = os.environ["BRANCH"]
          head_sha = os.environ["HEAD_SHA"]

          def gh(method, path, body=None):
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=json.dumps(body).encode() if body else None,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  }
              )
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          result = subprocess.run(["git","diff","--staged","--name-only"], capture_output=True, text=True)
          staged = [f.strip() for f in result.stdout.strip().splitlines() if f.strip()]

          blobs = []
          for fp in staged:
              if not os.path.exists(fp): continue
              with open(fp,"rb") as f:
                  content = base64.b64encode(f.read()).decode()
              blob = gh("POST", f"/repos/{repo}/git/blobs", {"content": content, "encoding": "base64"})
              blobs.append({"path": fp, "mode": "100644", "type": "blob", "sha": blob["sha"]})

          if not blobs: exit(0)

          commit     = gh("GET",  f"/repos/{repo}/git/commits/{head_sha}")
          tree       = gh("POST", f"/repos/{repo}/git/trees", {"base_tree": commit["tree"]["sha"], "tree": blobs})
          new_commit = gh("POST", f"/repos/{repo}/git/commits", {
              "message": "chore: export BigQuery DDL from contracts [skip ci]",
              "tree": tree["sha"], "parents": [head_sha]
          })
          gh("PATCH", f"/repos/{repo}/git/refs/heads/{branch}", {"sha": new_commit["sha"], "force": False})
          print(f"✅ Verified commit: {new_commit['sha']}")
          PYEOF

      - name: Done
        run: echo "✅ Action 1 complete"