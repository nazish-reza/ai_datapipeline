name: Generate dbt Models from Mapping

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "mapping/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-dbt-models:
    name: Generate dbt SQL & YML
    runs-on: ubuntu-latest

    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          # Use the default GITHUB_TOKEN so commits are attributed to the
          # verified github-actions bot identity
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Detect changed mapping files
        id: changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- mapping/ > changed_mappings.txt
          echo "Changed mapping files:"
          cat changed_mappings.txt
          echo "files=$(cat changed_mappings.txt | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Generate dbt models
        env:
          API_KEY: ${{ secrets.API_KEY }}
          INVOKE_URL: ${{ secrets.INVOKE_URL }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          python scripts/generate_dbt_models.py

      - name: Check generated files
        run: |
          echo "Generated files:"
          find dbt/models -name "*.sql" -o -name "*.yml" | sort

      - name: Commit generated dbt files
        run: |
          # Use the verified github-actions bot email
          # This exact email is GitHub's official bot identity → commits show as "Verified"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dbt/models/
          if git diff --staged --quiet; then
            echo "No changes to commit — models already up to date"
          else
            git commit -m "chore: auto-generate dbt models from mapping sheet [skip ci]"
            git push origin ${{ github.head_ref }}
            echo "Committed and pushed generated dbt files"
          fi