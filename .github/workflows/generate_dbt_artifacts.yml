name: "Action 2 — Generate dbt Models"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "contracts/**/*.yaml"

permissions:
  contents: write
  pull-requests: write

jobs:
  wait-for-ddl:
    name: Wait for DDL Action
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Action 1
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: "Validate Contract + BigQuery DDL"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success,skipped

  generate-dbt:
    name: Generate dbt SQL & YML
    runs-on: ubuntu-latest
    needs: wait-for-ddl

    steps:
      - name: Check if bot commit
        id: guard
        run: |
          if [ "${{ github.actor }}" = "github-actions[bot]" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout PR branch
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install pyyaml requests

      - name: Detect changed contracts
        if: steps.guard.outputs.skip != 'true'
        id: changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- contracts/ > changed.txt
          echo "Changed contracts:"
          cat changed.txt
          echo "files=$(cat changed.txt | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Generate dbt models
        if: steps.guard.outputs.skip != 'true'
        env:
          API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          INVOKE_URL: ${{ secrets.INVOKE_URL }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: python scripts/generate_dbt_models.py

      - name: Commit dbt models + registry via GitHub API
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git add dbt/
          if git diff --staged --quiet; then
            echo "No dbt changes to commit"
            exit 0
          fi
          echo "Files to commit:"
          git diff --staged --name-only

          python3 << 'PYEOF'
          import os, base64, subprocess, json, urllib.request

          token    = os.environ["GH_TOKEN"]
          repo     = os.environ["REPO"]
          branch   = os.environ["BRANCH"]
          head_sha = os.environ["HEAD_SHA"]

          def gh(method, path, body=None):
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=json.dumps(body).encode() if body else None,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  }
              )
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          result = subprocess.run(["git","diff","--staged","--name-only"], capture_output=True, text=True)
          staged = [f.strip() for f in result.stdout.strip().splitlines() if f.strip()]

          blobs = []
          for fp in staged:
              if not os.path.exists(fp): continue
              with open(fp,"rb") as f:
                  content = base64.b64encode(f.read()).decode()
              blob = gh("POST", f"/repos/{repo}/git/blobs", {"content": content, "encoding": "base64"})
              blobs.append({"path": fp, "mode": "100644", "type": "blob", "sha": blob["sha"]})

          if not blobs: exit(0)

          commit     = gh("GET",  f"/repos/{repo}/git/commits/{head_sha}")
          tree       = gh("POST", f"/repos/{repo}/git/trees", {"base_tree": commit["tree"]["sha"], "tree": blobs})
          new_commit = gh("POST", f"/repos/{repo}/git/commits", {
              "message": "chore: auto-generate dbt models from contracts [skip ci]",
              "tree": tree["sha"], "parents": [head_sha]
          })
          gh("PATCH", f"/repos/{repo}/git/refs/heads/{branch}", {"sha": new_commit["sha"], "force": False})
          print(f"✅ Verified commit: {new_commit['sha']}")
          PYEOF

      - name: Done
        run: echo "✅ Action 2 complete"